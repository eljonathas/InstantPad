name: Release

on:
  push:
    branches: [main]

# One release at a time, so two pushes never claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  verify:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore InstantPad.sln

      - name: Build
        run: dotnet build InstantPad.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test InstantPad.sln --configuration Release --no-build

      - name: Test the version script
        shell: bash
        run: bash build/next-version.test.sh

  release:
    name: Publish release
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out with history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Work out the next version
        id: version
        shell: bash
        run: |
          version="$(bash build/next-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        if: steps.version.outputs.version != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Publish the executable
        if: steps.version.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish src/InstantPad.Desktop/InstantPad.Desktop.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            --output publish \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version="$VERSION"

      - name: Write the checksum
        if: steps.version.outputs.version != ''
        shell: bash
        working-directory: publish
        run: sha256sum InstantPad.exe > InstantPad.exe.sha256

      - name: Create the tag and the release
        if: steps.version.outputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            publish/InstantPad.exe \
            publish/InstantPad.exe.sha256 \
            --target "$GITHUB_SHA" \
            --title "InstantPad $VERSION" \
            --generate-notes
