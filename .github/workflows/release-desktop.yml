name: Release desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 2.0.0
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: macOS Apple silicon, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macOS Intel, os: macos-latest, target: x86_64-apple-darwin }
          # The oldest supported Ubuntu, so the AppImage runs on older systems too.
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev libclang-dev

      - name: Point bindgen at LLVM
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Set up the toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: apps/desktop
          tagName: v${{ inputs.version }}
          releaseName: InstantPad ${{ inputs.version }}
          releaseDraft: true
          args: --target ${{ matrix.target }} --config '{"version":"${{ inputs.version }}"}'

      - name: Upload the portable executable
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          cp "target/$TARGET/release/InstantPad.exe" InstantPad-portable.exe
          gh release upload "v$VERSION" InstantPad-portable.exe --clobber
