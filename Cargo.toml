[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
instantpad-application = { path = "crates/application" }
instantpad-audio = { path = "crates/audio" }
instantpad-catalog = { path = "crates/catalog" }
instantpad-domain = { path = "crates/domain" }
instantpad-platform = { path = "crates/platform" }
instantpad-storage = { path = "crates/storage" }
instantpad-test-support = { path = "crates/test-support" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri = "2.12"
tauri-build = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "zip"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror = "2"
tokio = { version = "1.54", default-features = false }
uuid = { version = "1.29", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
